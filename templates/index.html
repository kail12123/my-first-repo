<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kazakhstan Cities Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .features {
            margin-top: 50px;
            text-align: left;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            margin: 15px 0;
            color: #555;
        }
        
        .feature-icon {
            font-size: 1.5em;
            margin-right: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ Kazakhstan Cities</h1>
        <p class="subtitle">Explore cities with interactive map</p>
        
        <a href="/map" class="btn">View Map →</a>
        
        <div class="features">
            <div class="feature-item">
                <span class="feature-icon">📍</span>
                <span>Interactive Leaflet map with city markers</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">📸</span>
                <span>High-quality city photos from internet</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">ℹ️</span>
                <span>City information and descriptions</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">📱</span>
                <span>Fully responsive design</span>
            </div>
        </div>
    </div>
</body>
</html>
